name: Reconciliation tests

on:
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/reconciliation-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn yfinance statsmodels pandas-datareader
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
