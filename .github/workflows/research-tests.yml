name: Research tests

on:
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/research-tests.yml"
  push:
    branches:
      - main
      - research/revised-paper-phase1-validation
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/research-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase1-lock.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
