name: Research tests
on:
  pull_request:
  push:
    branches: [main, publication/final-repository-consolidation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-phase1-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.validate_publication
      - run: python -m scripts.phase3_final_results --validate-only
