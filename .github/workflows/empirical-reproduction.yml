name: Empirical diagnostic and reconciliation audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/reconcile-crisis-and-tau-pipeline
      - research/revised-paper-phase1-validation
    paths:
      - ".github/workflows/empirical-reproduction.yml"
      - "analysis/crisis_analysis.py"
      - "analysis/supplementary_diagnostics.py"
      - "analysis/factor_regression.py"
      - "analysis/ownership_research.py"
      - "core/**"
      - "models/**"
      - "backtesting/**"
      - "tests/**"
      - "config/**"
      - "requirements-phase1-lock.txt"
      - "docs/PHASE1_FINANCIAL_VALIDATION.md"
      - "docs/phase1/**"
      - "pipelines/tri_market_pipeline.py"
      - "scripts/verify_paper_results.py"
      - "scripts/validate_generated_outputs.py"
      - "scripts/audit_paper_arithmetic.py"

permissions:
  contents: read

jobs:
  empirical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase1-lock.txt
      - name: Validate source and synthetic numerical tests
        run: python -m unittest discover -s tests -v
      - name: Run all three market studies and crisis and tau diagnostics
        id: run_study
        run: python -m pipelines.run_tri_market_pipeline
      - name: Compare newly generated outputs with historical manuscript tables
        if: steps.run_study.outcome == 'success'
        run: python -m scripts.verify_paper_results
      - name: Validate every generated output schema and finance invariant
        if: steps.run_study.outcome == 'success'
        run: python -m scripts.validate_generated_outputs
      - name: Check manuscript return turnover and figure arithmetic
        if: steps.run_study.outcome == 'success'
        run: python -m scripts.audit_paper_arithmetic
      - name: Upload audit reports only (no raw vendor price histories)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-litterman-empirical-audit
          if-no-files-found: warn
          path: |
            results/generated/*/equilibrium_prior_history.csv
            results/generated/regime_performance_expost.csv
            results/generated/bootstrap_sharpe_differences.csv
            results/generated/*/regime_probabilities_expost.csv
            results/generated/tri_market_summary.csv
            results/generated/dataset_manifest.csv
            results/generated/factor_regression_us.csv
            results/generated/crisis_summary.csv
            results/generated/tau_sensitivity.csv
            results/generated/paper_reconciliation.csv
            results/generated/paper_reconciliation.json
            results/generated/OUTPUT_VALIDATION.json
            results/generated/paper_arithmetic_audit.csv
            results/generated/paper_arithmetic_audit.json
            results/generated/RUN_MANIFEST.json
          retention-days: 30
